margin-right: 29px;

/* Общая ширина блока article будет width + border-left + border-right */

@media screen and (orientation: portrait) {

	width: 94vw;
	margin: 0 auto;

}

pre {padding: 9px; white-space: pre-wrap; text-align: left; color: #90ee90; font: 11pt Consolas, monospace;

tt {
padding: 1px 5px; font-size: 13px; color: #aaa;

}

}

  clear: both;
}
.с {

/* Выводим текст перед тегом <span class="nb"></span> */

.nb::before {
display: block;
float: left;

content: "NB \2002 !";

/* Открые и закрытие блока - начало*/

}

}

	max-height: 0px;
	transition: max-height 0.7s ease-in-out;
	overflow: hidden;
	border: 1px solid white;

.zoom:hover {cursor: zoom-in;
}

}
.zoom-out {cursor: zoom-in; transform: scale(1); transition: all 1s ease-in-out;

.tag {

}

<body>

<article>

<h1 id="headline" style="font: 99px 'Avalon Medium'; color: #fde910; margin: 0 0 79px 0; padding-top: 19px; border: 1px solid transparent"><div style="text-align: center">Перемещение картинки</div></h1>


<main id="ini">
<figure style="width: 21rem; height: 9rem" class="floatL">
<img src="Музы.jpg" style="width: 21rem" onclick="enlargePic(this,4)" class="picture" />
</figure>
<figcaption>Саркофаг муз (II в. н. э. Лувр, Париж). Слева направо: Каллиопа (со свитком), Талия (с маской в руке), Эрато, Эвтерпа (с духовым музыкальным инструментом), Полигимния, Клио, Терпсихора (с кифарой), Урания (с жезлом и глобусом), Мельпомена (с театральной маской на голове)</figcaption>

<br /><br />

<figure style="width: 12rem; height: 13rem" class="floatL clear">
<img src="lupa.jpg" style="width: 12rem" onclick="enlargePic(this,6)" class="picture" />
<figcaption>«Капитолийская волчица» (лат. Lupa Capitolina),<br />вскармливающая молоком Ромула и Рема.</figcaption>
</figure>

<p class="clear"></p>

<script type="text/javascript">

function enlargePic(pic, Ntimes){

let picRectangle = pic.getBoundingClientRect();
var picLeft = `${picRectangle.left}`, picTop = `${picRectangle.top}`;

  var docWidth = document.documentElement.clientWidth,
      docHeight = document.documentElement.clientHeight;
  var picWidth = pic.clientWidth,
      picHeight = pic.clientHeight;
  var countedPointX = (docWidth - picWidth)/2 - Math.round(picLeft) + 'px',
      countedPointY = (docHeight - picHeight)/2 - Math.round(picTop) + 'px';

if(even === true){
pic.style.zIndex = 5;
pic.style.position = 'absolute';
pic.style.transform = 'translate3D('+countedPointX+','+countedPointY+', 0) scale('+Ntimes+')';

setTimeout(function(){
let increasedPicRectangle = pic.getBoundingClientRect();
var increasedPicTop = `${increasedPicRectangle.top}`;
var increasedPicLeft = `${increasedPicRectangle.left}`;
var increasedPicWidth = `${increasedPicRectangle.width}`;
var increasedPicHeight = `${increasedPicRectangle.height}`;

if (increasedPicLeft < 0) {
var percentW = Math.round(((increasedPicWidth-docWidth)*100)/increasedPicWidth)+'%';
pic.style.transformOrigin = percentW+' 50%';
pic.style.transform = 'translate3D('+(increasedPicWidth-docWidth)+'px, '+countedPointY+', 0) scale('+Ntimes+')';
}

if (increasedPicTop < 0) {
var percentH = Math.round(((increasedPicHeight-docHeight)*100)/increasedPicHeight)+'%';
pic.style.transformOrigin = '50% '+percentH;
pic.style.transform = 'translate3D('+countedPointX+', '+(increasedPicHeight-docHeight)+'px, 0) scale('+Ntimes+')';
}

if (increasedPicLeft < 0 && increasedPicTop < 0) {
var percentH = Math.round(((increasedPicHeight-docHeight)*100)/increasedPicHeight)+'%';
pic.style.transformOrigin = percentW+' '+percentH;
pic.style.transform = 'translate3D('+(increasedPicWidth-docWidth)+'px, '+(increasedPicHeight-docHeight)+'px, 0) scale('+Ntimes+')';
}

/*
if (increasedPicLeft < 0) {
pic.style.marginLeft = (increasedPicWidth-docwidth)+'px';
}
if (increasedPicTop < 0) {
pic.style.marginTop = (increasedPicHeight-docHeight)+'px';
}
if (increasedPicLeft < 0 && increasedPicTop < 0) {
pic.style.marginLeft = (increasedPicWidth-docWidth)+'px';
pic.style.marginTop = (increasedPicHeight-docHeight)+'px';
}
*/
}, 1500);
}
else {
pic.style.transformOrigin = '50% 50%';
pic.style.zIndex = 1;
pic.style.position = 'relative';
pic.style.transform = 'scale(1)';
//pic.style.marginLeft = 0+'px';
//pic.style.marginTop = 0+'px';
}
doclick();
}

var times = 0;
var even = true;
// Счётчик нужен для открытия и закрытия картинок
function doclick() {
times++;
even = !(times % 2); // результат true или false
}

</script>

</main>



</article>

<!--
Сценарий размещается после тега body

На странице должен быть тег article, в котором будет создан тег pre для размещения посвеченного текста.

Текст, который нужно подсветить, должен располагаться внутри любого элемента с id="ini"
-->

<script type="text/javascript">

// Создаём блок <pre id='fini'> для вывода в него результата
const pre = document.createElement('pre');
pre.id = 'fini';
pre.style.margin = "29px";
document.getElementsByTagName('article')[0].appendChild(pre);

// Добавляем отдельный блок стилей <style> для подсветки синтаксиса
const style = document.createElement('style');
style.innerHTML = 'r-ed{color:#cc4500} r-ed span{color:red} g-reen{color:#90ee90} g-reen span{color:orange} b-lue{color:#00bfff} w-hite{color:white} g-old{color:goldenrod} l-ilac{color:#8080b0} #fini{font-family: Consolas; color: white; background: rgba(199, 199, 199, 0.1); border: 1px dotted green; padding: 29px}';
document.head.appendChild(style);

// Константа result вызывает функцию Syntax при загрузке страницы без функции onload
const result = Syntax(document.getElementById('ini').innerHTML);

function Syntax(code) {

// code – здесь это document.getElementById('ini').innerHTML, переданный константой result, вызвавшей функцию Syntax

    var safe = { '<': '&lt;', '>': '&gt;', '&': '&amp;' };

    return code

/*
Перед точкой .replace берёт в качестве строки содержимое, переданное константой result при запуске функции Syntax через переменную code.
Точка с запятой ; ставится только после последнего replace.
*/

.replace(/[<>&]/g, function(m) { return safe[m]; }) // Заменяем знаки <>& на мнемоники из переменной safe

.replace(/(class|id|type|title|onclick|alt|onmouseover)([^a-z0-9\$_])/gm, '<r-ed>$1</r-ed>$2') // Выделяем красным атрибуты
    
.replace(/(\{|\}|\]|\[|\|)/g, '<g-old>$1</g-old>') // Выделяем скобки
    
.replace(/\'.*?\'/gm, '<l-ilac>$&</l-ilac>') // Выделяем одинарные кавычки
    
.replace(/\".*?\"/gm, '<g-old>$&</g-old>') // Выделяем двойные кавычки

.replace(/([a-z\_\$][a-z0-9_]*)[\s]*\(/gi, '<g-old>$1</g-old>(') // Выделяем имена функций

.replace(/(&lt;)(.*?)(&gt;)/g, '<b-lue>$1$2$3</b-lue>') // Выделяем синим теги и комментарии html

.replace(/^(\s{0,}|\t{0,})(\#|\.{0,1})(\w{1,}\b|\:\s|\t)(.*?$)/gm, '$1<b-lue>$2$3</b-lue><g-old>$4</g-old>') // Выделяем синим первые слова в строке (не теги)

.replace(/(&lt;!--)(.|\n)*?(--&gt;)/gm, '<g-reen>$&</g-reen>') // Выделяем комментарии <!-- -->
    
.replace(/(\/\*)(.|\n)*?(\*\/)/gm, '<g-reen>$&</g-reen>') // Выделяем комментарии /**/
    
.replace(/^|(\s|\t){0,}\/\/.*?$/gm, '<g-reen>$&</g-reen>') // Выделяем комментарии //
    
//.replace(/\n/g, '<'+'br>') // Добавляем переводы строк, если обработанный текст выводится не в блок <pre>
    
.replace(/\t/g, '&'+'nbsp;&'+'nbsp;&'+'nbsp;&'+'nbsp;'); // Табуляцию заменяем неразрывными пробелами

}

document.getElementById('fini').innerHTML = result;

</script>

<script type="text/javascript">
const span = document.createElement('span');
span.id = 'modified';
span.style.margin = "29px";
document.getElementsByTagName('article')[0].appendChild(span);
var mod = ShowModifiedDate(document.lastModified);

function ShowModifiedDate(mod) {
var m = String(mod).slice(0, 2);
var d = String(mod).slice(3, 5);
var y = String(mod).slice(6, 10);

var mm = (01==m)?'января':(02==m)?'февраля':(03==m)?'марта':(04==m)?'апреля':(05==m)?'мая':(06==m)?'июня':(07==m)?'июля':(08==m)?'августа':(09==m)?'сентября':(10==m)?'октября':(11==m)?'ноября':'декабря';

document.getElementById("modified").innerHTML = d+' '+mm+' '+y+' г.<br /><br />';
document.getElementById("modified").title = mod;
}





</script>
